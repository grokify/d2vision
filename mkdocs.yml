site_name: d2vision
site_description: Tools for D2 diagram parsing, generation, and AI-assisted creation
site_url: https://grokify.github.io/d2vision
repo_url: https://github.com/grokify/d2vision
repo_name: grokify/d2vision

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: guides/getting-started.md
  - Commands:
      - Overview: guides/commands/index.md
      - parse: guides/commands/parse.md
      - generate: guides/commands/generate.md
      - template: guides/commands/template.md
      - pipeline: guides/commands/pipeline.md
      - convert: guides/commands/convert.md
      - learn: guides/commands/learn.md
      - lint: guides/commands/lint.md
      - diff: guides/commands/diff.md
      - watch: guides/commands/watch.md
      - analyze: guides/commands/analyze.md
      - review: guides/commands/review.md
      - compact: guides/commands/compact.md
      - icons: guides/commands/icons.md
      - rotate: guides/commands/rotate.md
      - card: guides/commands/card.md
      - svg2gif: guides/commands/svg2gif.md
  - Cookbook:
      - Overview: guides/cookbook/index.md
      - Layout Fundamentals: guides/cookbook/layout-fundamentals.md
      - Layout Engines: guides/cookbook/layout-engines.md
      - Side-by-Side Layouts: guides/cookbook/side-by-side.md
      - Container Patterns: guides/cookbook/containers.md
      - Cross-Container Edges: guides/cookbook/cross-container-edges.md
      - Sequence Diagrams: guides/cookbook/sequence-diagrams.md
      - SQL Tables: guides/cookbook/sql-tables.md
      - Styling: guides/cookbook/styling.md
      - Pipeline Use Cases: guides/cookbook/pipeline-use-cases.md
  - Examples:
      - Overview: guides/examples/index.md
  - Case Studies:
      - Overview: design/case-studies/index.md
      - Fixing Forward Through Three Breaking Upgrades: design/case-studies/fix-forward-chromedp-cdproto-toon.md
  - Releases:
      - Overview: releases/index.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md
  - Lint Rules: guides/lint-rules.md
  - API Reference: guides/api-reference.md
  - Troubleshooting: guides/troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/d2vision
